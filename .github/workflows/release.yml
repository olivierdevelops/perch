name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target.os }}-${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: darwin,  arch: amd64, triple: x86_64-apple-darwin,       runner: macos-latest,   ext: ''     }
          - { os: darwin,  arch: arm64, triple: aarch64-apple-darwin,      runner: macos-latest,   ext: ''     }
          - { os: linux,   arch: amd64, triple: x86_64-unknown-linux-gnu,  runner: ubuntu-latest,  ext: ''     }
          - { os: linux,   arch: arm64, triple: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, ext: ''   }
          - { os: windows, arch: amd64, triple: x86_64-pc-windows-msvc,    runner: windows-latest, ext: '.exe' }
          - { os: windows, arch: arm64, triple: aarch64-pc-windows-msvc,   runner: windows-latest, ext: '.exe' }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.triple }}

      - name: build
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target.triple }} -p perch -p perch-lsp -p perch-mcp
          for pair in perch:perch perch-lsp:perch-lsp perch-mcp:perch-mcp; do
            SRC="target/${{ matrix.target.triple }}/release/${pair%%:*}${{ matrix.target.ext }}"
            OUT="${pair##*:}-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.ext }}"
            cp "$SRC" "$OUT"
            shasum -a 256 "$OUT" > "$OUT.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: perch-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: |
            perch-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: write checksums
        run: |
          (cd dist && shasum -a 256 perch-* | grep -v '.sha256' > ../checksums.txt)
          mv checksums.txt dist/

      - name: gh release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/*
