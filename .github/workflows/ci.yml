name: CI

on:
  push:
    branches: [main, rust-port]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        # TODO: Windows tests are not yet green; don't block on them until fixed.
        continue-on-error: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            # Publish EVERY failing test + panic message: strip ANSI, then split into
            # several ::error annotations (each < 3500 chars; GitHub caps one at 4 kB).
            sed 's/\x1b\[[0-9;]*m//g' test.log | tr -d '\r' > clean.log
            grep -E -A4 "^---- .* stdout ----|^test .* FAILED|^error(\[|:)" clean.log \
              | grep -E -v "^(--|\s*$)" | cut -c1-500 > fail.txt || true
            awk -v max=3500 'BEGIN{n=1; len=0}
              { l=$0; gsub(/%/,"%25",l); gsub(/\r/,"",l)
                if (len+length(l)+3 > max) { n++; len=0 }
                chunk[n]=chunk[n] l "%0A"; len+=length(l)+3 }
              END{ for(i=1;i<=n;i++) print "::error title=test failures (" ENVIRON["RUNNER_OS"] ") " i "/" n "::" chunk[i] }' fail.txt | head -n 8
            msg=$(grep -E "^test .* FAILED" clean.log | sort -u | cut -c1-200 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=failed tests ($RUNNER_OS)::${msg:0:3500}"
            tail=$(tail -n 25 clean.log | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=log tail ($RUNNER_OS)::$tail"
          fi
          exit $code

      - name: cargo build
        run: cargo build --release -p perch -p perch-lsp -p perch-mcp

      - name: smoke test
        if: runner.os != 'Windows'
        run: |
          ./target/release/perch --version
          ./target/release/perch --init -f /tmp/sample.perch
          ./target/release/perch --help -f /tmp/sample.perch
          ./target/release/perch -f /tmp/sample.perch hello

      - name: demos build
        if: runner.os != 'Windows'
        run: |
          for d in demos/*/; do
            echo "=== ${d} ==="
            (cd "$d" && ../../target/release/perch --help)
          done

      - name: fat-binary round-trip
        if: runner.os != 'Windows'
        run: |
          (cd demos/04-portable-cli && ../../target/release/perch --build -o /tmp/greet)
          /tmp/greet hello -name=CI
          /tmp/greet --version
