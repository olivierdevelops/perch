name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build
        run: cargo build --release -p perch -p perch-lsp -p perch-mcp

      - name: smoke test
        if: runner.os != 'Windows'
        run: |
          ./target/release/perch --version
          ./target/release/perch --init -f /tmp/sample.perch
          ./target/release/perch --help -f /tmp/sample.perch
          ./target/release/perch -f /tmp/sample.perch hello

      - name: demos build
        if: runner.os != 'Windows'
        run: |
          for d in demos/*/; do
            echo "=== ${d} ==="
            (cd "$d" && ../../target/release/perch --help)
          done

      - name: fat-binary round-trip
        if: runner.os != 'Windows'
        run: |
          (cd demos/04-portable-cli && ../../target/release/perch --build -o /tmp/greet)
          /tmp/greet hello -name=CI
          /tmp/greet --version
