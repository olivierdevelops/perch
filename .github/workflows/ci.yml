name: CI

on:
  push:
    branches: [main, rust-port]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        # TODO: Windows tests are not yet green; don't block on them until fixed.
        continue-on-error: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^test .* FAILED|panicked at|^error(\[|:)|left:|right:" test.log | cut -c1-300 | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=test failures ($RUNNER_OS)::$msg"
          fi
          exit $code

      - name: cargo build
        run: cargo build --release -p perch -p perch-lsp -p perch-mcp

      - name: smoke test
        if: runner.os != 'Windows'
        run: |
          ./target/release/perch --version
          ./target/release/perch --init -f /tmp/sample.perch
          ./target/release/perch --help -f /tmp/sample.perch
          ./target/release/perch -f /tmp/sample.perch hello

      - name: demos build
        if: runner.os != 'Windows'
        run: |
          for d in demos/*/; do
            echo "=== ${d} ==="
            (cd "$d" && ../../target/release/perch --help)
          done

      - name: fat-binary round-trip
        if: runner.os != 'Windows'
        run: |
          (cd demos/04-portable-cli && ../../target/release/perch --build -o /tmp/greet)
          /tmp/greet hello -name=CI
          /tmp/greet --version
