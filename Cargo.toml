# Rust port of perch. Each VHCO folder is one crate; Cargo's dependency graph
# enforces "modules don't import each other" — only `orchestrator` depends on
# the others. The Go tree stays in place until the port reaches parity.
[workspace]
resolver = "2"
members = ["domain", "infra/audit", "infra/capyloader", "infra/embed", "infra/httpserver", "infra/interpreter", "infra/opcatalog", "infra/ops", "infra/preview", "infra/report", "infra/vscodeext", "usecases/commandhelp", "usecases/exportopscatalog", "usecases/help", "usecases/importsh", "usecases/initconfig", "usecases/installlsp", "usecases/installvscode", "usecases/listcommands", "usecases/runbuild", "usecases/runcommand", "usecases/runserver", "usecases/runshell", "usecases/runtests", "usecases/scan", "usecases/simulate", "usecases/validate", "io/cli", "orchestrator", "cmd/perch-lsp", "cmd/perch-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Third-party deps (notably wasmtime/cranelift) are compiled optimised even in
# dev builds: an unoptimised cranelift takes ~25s to compile a 1.5MB module,
# which looks like a hang. Workspace crates keep fast, debuggable dev builds.
[profile.dev.package."*"]
opt-level = 2
